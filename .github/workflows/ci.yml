name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nur lesen: Ein Pull Request aus einem Fork bekommt so auch kein Token, das schreiben darf.
permissions:
  contents: read

# GitHubs eigene Runner, nicht der self-hosted der Organisation: Das Repo ist öffentlich, und
# ein Pull Request aus einem Fork könnte auf einem eigenen Runner beliebigen Code ausführen.
# Für öffentliche Repos kosten GitHubs Runner nichts.
jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        # Shop und Helpdesk laufen mit verschiedenen Guzzle-Versionen (#53).
        guzzle: ['^7.4', '^8.0']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: xml
          coverage: none
          tools: composer:v2

      - run: composer validate --no-check-publish

      # Kein composer.lock: Ein Bundle wird mit den Versionen der App installiert, also prüft
      # die CI die jeweils neuesten, die composer.json erlaubt.
      - run: composer require --no-update --no-interaction "guzzlehttp/guzzle:${{ matrix.guzzle }}"
      - run: composer update --prefer-dist --no-progress --no-interaction

      - name: Syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -l > /dev/null

      - run: vendor/bin/phpunit
