services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  PM\PlentyMarketsBundle\Repository\AccessTokenRepository: ~
  PM\PlentyMarketsBundle\Repository\ApiHitsRepository: ~
  PM\PlentyMarketsBundle\Repository\ApiLockRepository: ~
  PM\PlentyMarketsBundle\Repository\LimitHistoryRepository: ~

  PM\PlentyMarketsBundle\Services\Twig\AccountsTwigExtension:
    tags: [ { name: twig.extension } ]

  PM\PlentyMarketsBundle\Services\Twig\ApiTwigExtension:
    arguments:
      $apiLockRepository: '@PM\PlentyMarketsBundle\Repository\ApiLockRepository'

  # The bundle's own serializer (Symfony), independent of the application's (#58).
  pm_plenty_markets.serializer:
    class: Symfony\Component\Serializer\SerializerInterface
    factory: ['PM\PlentyMarketsBundle\Component\Serializer\SerializerFactory', 'create']

  PM\PlentyMarketsBundle\Services\RestfulService:
    arguments:
      $accessTokenRepository: '@PM\PlentyMarketsBundle\Repository\AccessTokenRepository'
      $apiLockRepository: '@PM\PlentyMarketsBundle\Repository\ApiLockRepository'
      $limitHistoryRepository: '@PM\PlentyMarketsBundle\Repository\LimitHistoryRepository'
      $serializer: '@pm_plenty_markets.serializer'
      $objectManager: '@Doctrine\ORM\EntityManagerInterface'
      $logger: '@logger'
      $parameterGuzzleVerifySsl: '%pm__plenty_market.configuration.guzzle.verify_ssl%'
